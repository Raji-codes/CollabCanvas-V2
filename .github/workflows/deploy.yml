name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: CI (Continuous Integration: Install, Lint & Build)
  # -------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm install

      - name: ⚙️ Generate Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            cat << EOF > firebase-applet-config.json
          {
            "projectId": "gen-lang-client-0487921246",
            "appId": "1:396796690797:web:d805a4bc4c02fa393c9a64",
            "apiKey": "${FIREBASE_API_KEY}",
            "authDomain": "gen-lang-client-0487921246.firebaseapp.com",
            "firestoreDatabaseId": "ai-studio-c9a5aac4-d4d3-480e-bc87-877a32c06fbb",
            "storageBucket": "gen-lang-client-0487921246.firebasestorage.app",
            "messagingSenderId": "396796690797",
            "measurementId": ""
          }
          EOF
          fi

      - name: 🔍 Type-check & Lint
        run: npm run lint

      - name: 🏗️ Build production bundle
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: npm run build

      - name: 📤 Upload Build Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # -------------------------------------------------------------
  # Job 2: CD (Continuous Deployment: 100% Free Live Hosting)
  # -------------------------------------------------------------
  deploy-pages:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # Job 3: Automated Docker Image Build & Push
  # -------------------------------------------------------------
  docker-build-push:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Generate Firebase config for Docker build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            cat << EOF > firebase-applet-config.json
          {
            "projectId": "gen-lang-client-0487921246",
            "appId": "1:396796690797:web:d805a4bc4c02fa393c9a64",
            "apiKey": "${FIREBASE_API_KEY}",
            "authDomain": "gen-lang-client-0487921246.firebaseapp.com",
            "firestoreDatabaseId": "ai-studio-c9a5aac4-d4d3-480e-bc87-877a32c06fbb",
            "storageBucket": "gen-lang-client-0487921246.firebasestorage.app",
            "messagingSenderId": "396796690797",
            "measurementId": ""
          }
          EOF
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub (if secrets configured)
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          HAS_DOCKER_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

      - name: 🔤 Lowercase repository name for Docker
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/collabcanvas:latest', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/collabcanvas:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || '' }}